<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verificación de documento · JAGUAR</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f5;color:#203040;font-family:Arial,Helvetica,sans-serif}.wrap{max-width:980px;margin:0 auto;padding:28px 18px 50px}.top{background:#1b365d;color:#fff;border-bottom:5px solid #d4af37;padding:18px 22px;border-radius:16px 16px 0 0}.top small{opacity:.8}.paper{position:relative;overflow:hidden;background:#fffdf7;min-height:620px;padding:44px 52px;border:1px solid #d7dadd;box-shadow:0 16px 50px #1b365d18}.watermark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;overflow:hidden;z-index:1}.watermark span{font-size:clamp(58px,10vw,118px);font-weight:900;letter-spacing:4px;transform:rotate(-28deg);white-space:nowrap;opacity:.11}.paper>*:not(.watermark){position:relative;z-index:2}.status{display:inline-flex;padding:9px 15px;border-radius:999px;font-weight:900;font-size:14px;letter-spacing:.5px}.valid{background:#dcf7e8;color:#08743b}.cancel{background:#fde1e1;color:#a31d1d}.expired{background:#ffe7cc;color:#9a4a00}.invalid{background:#e5e7eb;color:#4b5563}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:24px}.field{border:1px solid #d9dee3;border-radius:12px;padding:12px 14px;background:#fff}.field label{display:block;font-size:11px;color:#657383;text-transform:uppercase;font-weight:800;margin-bottom:5px}.field b{font-size:14px}.dochead{text-align:center;margin:22px 0}.dochead h1{font-size:25px;margin:8px 0}.dochead p{margin:4px 0;color:#657383}.notice{margin-top:26px;padding:15px 18px;border-left:5px solid #d4af37;background:#faf7e9}.foot{margin-top:26px;text-align:center;font-size:12px;color:#697784}.error{background:#fff;padding:40px;border-radius:16px;text-align:center;box-shadow:0 16px 50px #00000012}@media(max-width:650px){.paper{padding:28px 20px}.top{border-radius:12px 12px 0 0}}
</style>
</head>
<body><div class="wrap" id="app"><div class="error">Verificando documento…</div></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function statusInfo(s){return s==='valido'?['DOCUMENTO VÁLIDO','valid']:s==='cancelado'?['DOCUMENTO CANCELADO','cancel']:s==='expirado'?['DOCUMENTO EXPIRADO','expired']:['DOCUMENTO NO VÁLIDO','invalid']}
function field(label,value){return `<div class="field"><label>${esc(label)}</label><b>${esc(value||'—')}</b></div>`}
function render(d){const [label,cls]=statusInfo(d.estado);const x=d.documento||{},p=x.datos||{};const alumno=p.alumno||{};const inst=p.institucion||{};let detail='';if(Array.isArray(p.detalle)&&p.detalle.length)detail=`<div class="notice"><b>Información del documento</b><div class="grid">${p.detalle.slice(0,30).map(r=>field(r.label||'Dato',r.value)).join('')}</div></div>`;return `<div class="top"><b>${esc(inst.siglas||'JAGUAR')}</b><div><small>Verificación pública de documento escolar</small></div></div><section class="paper"><div class="watermark"><span>${label}</span></div><div class="status ${cls}">${label}</div><div class="dochead"><div style="font-size:12px;font-weight:800;color:#657383">${esc(inst.nombre_institucion||'PLATAFORMA JAGUAR')}</div><h1>${esc(x.titulo||'Documento escolar')}</h1><p>Folio de validación: <b>${esc(x.folio)}</b></p></div><div class="grid">${field('Estado',label)}${field('Fecha de emisión',new Date(x.fecha_emision).toLocaleDateString('es-MX',{day:'numeric',month:'long',year:'numeric'}))}${field('Fecha de expiración',x.fecha_expiracion?new Date(x.fecha_expiracion).toLocaleDateString('es-MX',{day:'numeric',month:'long',year:'numeric'}):'No establecida')}${alumno.nombre?field('Alumno',alumno.nombre):''}${alumno.matricula?field('Matrícula',alumno.matricula):''}${alumno.grupo?field('Grupo',alumno.grupo):''}${alumno.grado?field('Grado',alumno.grado):''}${alumno.ciclo?field('Ciclo escolar',alumno.ciclo):''}</div>${detail}<div class="notice">Este resultado corresponde al registro electrónico asociado al código QR. El estado mostrado es el que mantiene actualmente la institución.</div><div class="foot">Documento verificado mediante el sistema JAGUAR · ${esc(inst.siglas||'Institución escolar')}</div></section>`}
async function main(){try{const token=new URLSearchParams(location.search).get('token');if(!token)throw Error('No se recibió un código de validación.');const r=await fetch('/api/verificar?token='+encodeURIComponent(token));const d=await r.json();if(!r.ok||!d.ok){document.getElementById('app').innerHTML=`<div class="error"><h1>DOCUMENTO NO VÁLIDO</h1><p>${esc(d.error||'No se encontró el documento.')}</p></div>`;return}document.getElementById('app').innerHTML=render(d)}catch(e){document.getElementById('app').innerHTML=`<div class="error"><h1>DOCUMENTO NO VÁLIDO</h1><p>${esc(e.message)}</p></div>`}}
main();
</script></body></html>
