<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Verificación documental · Jaguar ITHLA</title>
<style>
:root{color-scheme:light;--navy:#112b4b;--navy2:#1b365d;--gold:#c9a54c;--teal:#008080;--ink:#20334c;--muted:#62758b;--background:#f2f5f9;--edge:#dfe5ed;--valid:#11834a;--warn:#9a570d;--bad:#b42b37}*{box-sizing:border-box}
body{margin:0;background:var(--background);color:var(--ink);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
header{background:linear-gradient(115deg,#0d2543,#1b365d 78%);color:white;border-top:5px solid var(--gold);box-shadow:0 7px 22px #0a244b18}
.header-inner{max-width:1270px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:17px 24px;gap:20px}.brand{display:flex;align-items:center;gap:16px}.brand img{width:53px;height:61px;object-fit:contain}.brand b{font:700 22px Georgia,serif}.brand small{display:block;font-size:11px;letter-spacing:2px;color:#dce6ee;margin-bottom:3px}.header-tag{color:#dfc57a;font-size:11px;font-weight:700;letter-spacing:1.5px;text-align:right}
.shell{max-width:1270px;margin:auto;padding:30px 24px 55px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:2.3px;color:#9e7b2f;text-transform:uppercase}.title{font:700 clamp(28px,3.2vw,42px)/1.12 Georgia,'Times New Roman',serif;color:#18304c;margin:10px 0}.subtitle{color:var(--muted);line-height:1.6;margin:0 0 26px;font-size:14px}
.overview{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;margin-bottom:20px}.verify-status{display:flex;align-items:center;gap:15px}.status-symbol{height:58px;width:58px;border-radius:50%;display:grid;place-items:center;background:#daf4e5;color:var(--valid);font-size:30px;font-weight:900;border:1px solid #acd8bc}.verify-status.cancelado .status-symbol,.verify-status.no_valido .status-symbol{background:#fde8ea;border-color:#efb9bf;color:var(--bad)}.verify-status.expirado .status-symbol{background:#fff3df;border-color:#edcd9c;color:var(--warn)}.verify-status b{font-size:22px;letter-spacing:.1px}.verify-status small{color:var(--muted);display:block;margin-top:5px;font-size:13px}.status-pill{border:1px solid #b5dfc9;border-radius:28px;background:#e7f9ee;color:#087240;padding:9px 15px;font-size:12px;font-weight:800;white-space:nowrap}.status-pill.cancelado,.status-pill.no_valido{background:#fff0f1;border-color:#f4c4c9;color:#9e1d2b}.status-pill.expirado{background:#fff4e3;border-color:#e9cb9a;color:#8a4a00}
.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(295px,.9fr);gap:20px;align-items:start}.panel{background:#fff;border:1px solid var(--edge);border-radius:16px;box-shadow:0 12px 28px #192c4510;overflow:hidden}.panel-head{padding:17px 21px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;border-bottom:1px solid var(--edge)}.panel-head h2{font:700 19px Georgia,serif;margin:0}.note{color:var(--muted);font-size:12px;line-height:1.55}
.preview{background:#e9edf3;padding:15px;min-height:700px;display:flex;flex-direction:column;align-items:center;justify-content:center}.preview iframe{border:1px solid #cbd4df;background:white;width:100%;height:760px;border-radius:6px;box-shadow:0 8px 28px #132f4b1a}.loading{color:var(--muted);display:flex;align-items:center;gap:12px;padding:35px}.spinner{width:22px;height:22px;border:3px solid #d8e2ed;border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.meta{padding:20px}.meta h3{font-size:11px;text-transform:uppercase;letter-spacing:1.8px;color:#98742d;margin:0 0 14px}.entry{padding:12px 0;border-bottom:1px solid #eef1f5}.entry:last-child{border:0}.entry small{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.entry strong{display:block;color:#1f344e;font-size:14px;line-height:1.5;word-break:break-word}.info{margin-top:16px;border-radius:11px;padding:14px;background:#f1f6f9;border-left:3px solid var(--teal);color:#53687d;font-size:12px;line-height:1.6}.panel-actions{display:flex;gap:9px;flex-wrap:wrap}.action{display:inline-flex;gap:7px;align-items:center;justify-content:center;text-decoration:none;border-radius:8px;padding:10px 13px;background:var(--navy2);color:#fff;font-size:12px;font-weight:700;border:1px solid var(--navy2)}.action.secondary{background:#fff;color:var(--navy2);border-color:#cad5df}.action:hover{filter:brightness(1.09)}
footer{text-align:center;color:var(--muted);font-size:12px;line-height:1.7;margin:30px auto 0}.notfound{padding:50px 20px;text-align:center;max-width:700px;margin:40px auto}.notfound .status-symbol{margin:auto auto 19px}.notfound h1{font:700 27px Georgia,serif}.notfound p{color:var(--muted);line-height:1.65}.notfound button{cursor:pointer}
@media(max-width:930px){.layout{grid-template-columns:1fr}.preview{min-height:500px}.preview iframe{height:660px}}@media(max-width:600px){.shell{padding:22px 13px 40px}.header-inner{padding:13px}.brand img{width:43px;height:48px}.brand b{font-size:17px}.header-tag{display:none}.overview{grid-template-columns:1fr}.status-pill{justify-self:start}.preview{padding:6px;min-height:400px}.preview iframe{height:550px}.panel-head,.meta{padding:16px}.verify-status b{font-size:19px}}
</style>
</head>
<body>
<header><div class="header-inner"><div class="brand"><img src="/assets/ithla-logo.png" alt="Escudo de ITHLA"><div><small>SISTEMA INSTITUCIONAL DE VERIFICACIÓN</small><b>Instituto Tecnológico e Histórico Latinoamericano</b></div></div><div class="header-tag">PLATAFORMA JAGUAR · ITHLA</div></div></header>
<main class="shell" id="app"><div class="loading"><div class="spinner"></div>Consultando el registro institucional…</div></main>
<script>
const escapeText=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const states={valido:{text:'DOCUMENTO VÁLIDO',symbol:'✓',detail:'El registro está vigente y autorizado en Jaguar.'},cancelado:{text:'DOCUMENTO CANCELADO',symbol:'×',detail:'La institución anuló este documento. No debe considerarse vigente.'},expirado:{text:'DOCUMENTO EXPIRADO',symbol:'!',detail:'La fecha de vigencia terminó. Consulte a la institución.'},no_valido:{text:'DOCUMENTO NO VÁLIDO',symbol:'×',detail:'No fue posible confirmar un registro vigente.'}};
function dateLabel(value){if(!value)return 'No establecida';const d=new Date(value);return Number.isNaN(d.getTime())?'No establecida':d.toLocaleDateString('es-MX',{day:'2-digit',month:'long',year:'numeric'});}
function item(label,value){if(value===undefined||value===null||String(value).trim()==='')return '';return `<div class="entry"><small>${escapeText(label)}</small><strong>${escapeText(value)}</strong></div>`;}
function fail(message){document.getElementById('app').innerHTML=`<div class="panel notfound"><div class="status-symbol" style="color:#b42b37;background:#fff0f1;border-color:#edbcc1">×</div><h1>No se pudo validar el documento</h1><p>${escapeText(message||'El código de verificación no existe o no es válido.')}</p><p>Solicita al plantel un documento con código verificable vigente.</p></div>`;}
function render(data,token){
 const record=data.documento||{}, p=record.datos||{}, inst=p.institucion||{}, student=p.alumno||{};
 const state=states[data.estado]||states.no_valido;
 const meta=[item('Folio de control',record.folio),item('Tipo de documento',record.titulo||record.tipo),item('Institución',inst.nombre_institucion||inst.nombre),item('Fecha de emisión',dateLabel(record.fecha_emision)),item('Fecha de expiración',dateLabel(record.fecha_expiracion)),item('Nombre',student.nombre),item('Matrícula',student.matricula),item('Grado / Grupo',[student.grado,student.grupo].filter(Boolean).join(' · ')),item('Ciclo escolar',student.ciclo)].join('');
 const details=Array.isArray(p.detalle)?p.detalle.slice(0,20).map(r=>item(r?.label||'Dato',typeof r?.value==='object'?'':r?.value)).join(''):'';
 const source='/api/verificar?token='+encodeURIComponent(token)+'&pdf=1';
 document.title=`${state.text} | Verificación Jaguar`;
 document.getElementById('app').innerHTML=`<div class="eyebrow">Consulta de autenticidad</div><h1 class="title">Verificación de documento escolar</h1><p class="subtitle">El resultado se consulta directamente del registro electrónico institucional. La vista PDF está marcada según el estado actual del documento.</p><section class="overview"><div class="verify-status ${escapeText(data.estado)}"><div class="status-symbol">${state.symbol}</div><div><b>${state.text}</b><small>${escapeText(state.detail)}</small></div></div><span class="status-pill ${escapeText(data.estado)}">ESTADO REGISTRADO · ${escapeText(data.estado||'no_valido').toUpperCase()}</span></section><div class="layout"><section class="panel"><div class="panel-head"><div><h2>Vista del documento</h2><div class="note">El PDF muestra una marca de agua diagonal que indica su estado actual.</div></div><div class="panel-actions"><a class="action secondary" href="${source}" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer">Abrir PDF ↗</a><a class="action" href="${source}" download="verificacion-jaguar.pdf" referrerpolicy="no-referrer">Descargar PDF ↓</a></div></div><div class="preview"><iframe title="Vista PDF de la verificación institucional" loading="lazy" referrerpolicy="no-referrer" src="${source}#toolbar=0"></iframe></div><div class="meta"><div class="note"><b>Sobre esta vista:</b> Por protección de datos, cuando el documento original no está clasificado expresamente como público se muestra una representación PDF del registro de validación. Un PDF original privado no se hace público mediante el QR.</div></div></section><aside class="panel"><div class="panel-head"><h2>Registro institucional</h2></div><div class="meta"><h3>Datos de verificación</h3>${meta}${details?'<h3 style="margin-top:25px">Información complementaria</h3>'+details:''}<div class="info">Este resultado proviene de Jaguar y refleja el estado registrado por la institución. El sello visual de validación no reemplaza la consulta en línea del código de verificación.</div></div></aside></div><footer>Instituto Tecnológico e Histórico Latinoamericano · Sistema Jaguar<br>Documento electrónico sujeto al registro institucional de vigencia y cancelación</footer>`;
}
async function start(){const token=new URLSearchParams(location.search).get('token');if(!token)return fail('No se proporcionó un código de validación.');try{const response=await fetch('/api/verificar?token='+encodeURIComponent(token),{cache:'no-store',referrerPolicy:'no-referrer'});const data=await response.json();if(!response.ok||!data.ok)return fail(data.error);render(data,token);}catch{fail('No se pudo conectar con el servicio institucional. Intenta nuevamente más tarde.');}}
start();
</script>
</body></html>
